name: Backfill Blog Images
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Target a single post by slug (leave blank to process all posts with empty coverImage)"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate missing images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BLOG_DIR: content/blog
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            node scripts/backfill-images.mjs --slug "${{ github.event.inputs.slug }}"
          else
            node scripts/backfill-images.mjs
          fi
      - name: Commit and push
        run: |
          git config user.name "AEOCheck Bot"
          git config user.email "bot@aeocheck.co"
          git add content/blog/ public/images/blog/
          git diff --staged --quiet || (git commit -m "chore: backfill blog cover images" && git push)