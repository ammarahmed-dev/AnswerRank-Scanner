name: On Publish (IndexNow + GSC)

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated blog slugs to notify search engines about"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Detect changed posts
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLUGS="$INPUT_SLUGS"
          else
            # Diff the whole push, not just the last commit (a push can carry several commits).
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=HEAD~1
            fi
            SLUGS=$(git diff --name-only "$BASE" HEAD -- 'content/blog/**' \
              | grep -E '\.(mdx|md)$' \
              | xargs -r -n1 basename \
              | sed -E 's/\.(mdx|md)$//' \
              | tr '\n' ' ')
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Changed slugs: $SLUGS"

      - name: Wait for deployment to go live
        if: steps.changed.outputs.slugs != ''
        run: |
          # Give Vercel time to build before search engines fetch the new URLs.
          # Replace with a deployment-status check if you prefer (vercel CLI or deploy hook).
          sleep 180

      - name: Ping IndexNow (Bing/Yandex/etc.)
        if: steps.changed.outputs.slugs != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CHANGED_SLUGS: ${{ steps.changed.outputs.slugs }}
        run: node scripts/indexnow-ping.mjs

      - name: Resubmit sitemap to Google Search Console
        if: steps.changed.outputs.slugs != ''
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/gsc-submit-sitemap.mjs
